<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlowPy — node IDE for MicroPython</title>
<style>
:root{
  --bg:#0e1116; --bg2:#151a21; --bg3:#1b222c; --line:#2a3340; --line2:#38445a;
  --fg:#dfe6f0; --fg2:#94a3b8; --acc:#4fa3ff; --acc2:#2b6fc2;
  --ok:#22e06a; --warn:#f5b23f; --err:#ff5d5d;
  --fb:#7c5cff; --f:#00b3a4; --io:#f5883f; --varc:#e0679b; --konst:#8a94a6;
  --r:6px; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:13px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
button,input,select,textarea{font-family:inherit;font-size:12px;color:var(--fg)}
button{background:var(--bg3);border:1px solid var(--line);border-radius:var(--r);padding:5px 10px;cursor:pointer}
button:hover{background:#232c39;border-color:var(--line2)}
button:disabled{opacity:.4;cursor:not-allowed}
button.pri{background:var(--acc2);border-color:#3f86d8}
button.pri:hover{background:#3f86d8}
button.ok{background:#16603a;border-color:#1e8a52}
button.ok:hover{background:#1e8a52}
button.danger{background:#5f2020;border-color:#8a2f2f}
input,select,textarea{background:#0b0e13;border:1px solid var(--line);border-radius:4px;padding:4px 6px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
label{font-size:11px;color:var(--fg2)}

#app{display:grid;grid-template-rows:42px 1fr;height:100%}
#top{display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--bg2);border-bottom:1px solid var(--line)}
#top .brand{font-weight:700;letter-spacing:.3px;margin-right:8px}
#top .brand span{color:var(--acc)}
#top .sp{flex:1}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
#main{display:grid;grid-template-columns:212px 1fr 340px;min-height:0}
#left,#right{background:var(--bg2);display:flex;flex-direction:column;min-height:0}
#left{border-right:1px solid var(--line)}
#right{border-left:1px solid var(--line)}
#center{position:relative;min-width:0;display:flex;flex-direction:column}
.panelhd{padding:6px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--fg2);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;flex:0 0 auto}
.panelhd button{padding:2px 6px;font-size:11px}
.scroll{overflow:auto;min-height:0}
.scroll::-webkit-scrollbar{width:9px;height:9px}
.scroll::-webkit-scrollbar-thumb{background:#2c3644;border-radius:5px}

/* palette */
#pal{padding:6px}
.palgroup{margin-bottom:8px}
.palgroup>.t{font-size:10px;color:var(--fg2);text-transform:uppercase;letter-spacing:.6px;margin:6px 2px 4px}
.palitem{display:flex;align-items:center;gap:6px;padding:4px 6px;border:1px solid var(--line);border-radius:5px;background:var(--bg3);margin-bottom:4px;cursor:grab;user-select:none}
.palitem:hover{border-color:var(--acc)}
.palitem .k{font:10px/1 var(--mono);padding:2px 4px;border-radius:3px;background:#0b0e13;color:var(--fg2);border:1px solid var(--line)}
.palitem .k.FB{color:#b9a6ff;border-color:#4b3a91}
.palitem .k.F{color:#6fe4d8;border-color:#1b6a63}
.palitem .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.palitem .e{opacity:0;font-size:11px;color:var(--fg2)}
.palitem:hover .e{opacity:1}

/* canvas */
#cwrap{flex:1;position:relative;overflow:hidden;background:
  radial-gradient(circle at 1px 1px, #2b3340 1px, transparent 0) 0 0/20px 20px, #14181f;cursor:default}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#wires{position:absolute;left:-20000px;top:-20000px;width:40000px;height:40000px;overflow:visible;pointer-events:none}
#wires .hit{stroke:transparent;stroke-width:14;fill:none;pointer-events:stroke;cursor:pointer}
#nodes{position:absolute;left:0;top:0}
#crumb{position:absolute;left:8px;top:8px;z-index:5;display:flex;gap:6px;align-items:center;background:rgba(21,26,33,.92);border:1px solid var(--line);border-radius:var(--r);padding:4px 8px;font-size:12px}
#crumb a{color:var(--acc);cursor:pointer;text-decoration:none}
#hint{position:absolute;right:8px;top:8px;z-index:5;background:rgba(21,26,33,.92);border:1px solid var(--line);border-radius:var(--r);padding:4px 8px;font-size:11px;color:var(--fg2)}

.node{position:absolute;background:var(--bg2);border:1px solid var(--line2);border-radius:7px;
  box-shadow:0 3px 12px rgba(0,0,0,.45);user-select:none;font-size:12px}
.node.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 3px 16px rgba(79,163,255,.3)}
.node.moving{outline:1px dashed rgba(79,163,255,.7);outline-offset:3px}
.node.err{border-color:var(--err)}
.node .hd{height:20px;display:flex;align-items:center;gap:5px;padding:0 6px;border-radius:6px 6px 0 0;font-size:11.5px;
  background:linear-gradient(#232c39,#1b222c);border-bottom:1px solid var(--line);cursor:move;font-weight:600;overflow:hidden}
.node .hd .badge{font:9px/1 var(--mono);padding:2px 3px;border-radius:3px;border:1px solid;flex:0 0 auto}
.node .hd .ttl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.node.k-FB .hd .badge{color:#b9a6ff;border-color:#4b3a91;background:#1d1733}
.node.k-F  .hd .badge{color:#6fe4d8;border-color:#1b6a63;background:#0d2b28}
.node.k-io .hd{background:linear-gradient(#3a2a17,#2a1f12)}
.node.k-var .hd{background:linear-gradient(#3a1f2c,#2a1720)}
.node.k-const .hd{background:linear-gradient(#242a33,#1a1f26)}
.node .body{position:relative}
.port{position:absolute;width:11px;height:11px;border-radius:50%;background:#0b0e13;border:2px solid var(--line2);cursor:crosshair;z-index:2}
.port:hover,.port.tgt{border-color:var(--acc);background:var(--acc);box-shadow:0 0 8px var(--acc)}
.port.bool{border-radius:2px}
.plabel{position:absolute;font-size:11px;color:var(--fg2);white-space:nowrap;pointer-events:none}
.node .val{position:absolute;right:6px;font:10px/1 var(--mono);color:var(--fg2)}
.node .pfield{position:absolute;left:6px;right:6px;height:18px}
.node .pfield input{width:100%;height:18px;padding:0 4px;font:11px/1 var(--mono)}
.wire{fill:none;stroke:#4a5768;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wire.back{stroke:#b07cff;stroke-dasharray:7 5}
.wlabel.backlabel{fill:#c9a4ff}
.wire.sel{stroke:var(--acc);stroke-width:3}
.wlabel{font:10px var(--mono);fill:#9fb0c6;paint-order:stroke;stroke:#0e1116;stroke-width:3px;stroke-linejoin:round}

/* right panel */
.tabs{display:flex;border-bottom:1px solid var(--line);flex:0 0 auto}
.tabs .tab{flex:1;text-align:center;padding:7px 4px;font-size:11px;color:var(--fg2);cursor:pointer;border-bottom:2px solid transparent}
.tabs .tab.on{color:var(--fg);border-bottom-color:var(--acc);background:var(--bg3)}
.tabbody{flex:1;min-height:0;overflow:auto;padding:10px}
.row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.row>label{width:74px;flex:0 0 auto}
.row>input,.row>select{flex:1;min-width:0}
.hr{height:1px;background:var(--line);margin:10px 0}
.sub{font-size:11px;color:var(--fg2);margin:10px 0 5px;text-transform:uppercase;letter-spacing:.5px}
textarea.code{width:100%;font:12px/1.5 var(--mono);background:#0b0e13;border:1px solid var(--line);border-radius:5px;padding:8px;resize:vertical;tab-size:4;white-space:pre;overflow-wrap:normal;overflow-x:auto}
pre.code{width:100%;font:11px/1.45 var(--mono);background:#0b0e13;border:1px solid var(--line);border-radius:5px;padding:8px;margin:0;overflow:auto;max-height:100%}
.plist{border:1px solid var(--line);border-radius:5px;overflow:hidden}
.plist .pr{display:flex;gap:4px;align-items:center;padding:4px;border-bottom:1px solid var(--line);background:#0b0e13}
.plist .pr:last-child{border-bottom:0}
.plist .pr input{flex:1;min-width:0}
.plist .pr select{width:64px}
.plist .pr button{padding:2px 6px}
.chip{display:inline-block;padding:1px 6px;border-radius:10px;font-size:10px;border:1px solid var(--line2);color:var(--fg2)}
.mono{font-family:var(--mono)}

/* console */
#bottom{height:150px;border-top:1px solid var(--line);background:#0b0e13;display:flex;flex-direction:column;flex:0 0 auto}
#bottom.min{height:26px}
#conhd{display:flex;align-items:center;gap:8px;padding:3px 8px;background:var(--bg2);border-bottom:1px solid var(--line);font-size:11px;color:var(--fg2);flex:0 0 auto}
#con{flex:1;overflow:auto;padding:6px 8px;font:11px/1.5 var(--mono);white-space:pre-wrap}
#con .e{color:var(--err)} #con .w{color:var(--warn)} #con .i{color:var(--fg2)} #con .g{color:var(--ok)}
#status{display:flex;align-items:center;gap:5px}
.dot{width:8px;height:8px;border-radius:50%;background:#556}
.dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.dot.busy{background:var(--warn)}
.dot.err{background:var(--err)}

/* modal */
#modal{position:fixed;inset:0;background:rgba(5,7,10,.65);display:none;align-items:center;justify-content:center;z-index:100}
#modal.on{display:flex}
.mbox{background:var(--bg2);border:1px solid var(--line2);border-radius:10px;padding:16px;width:420px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.mbox h3{margin:0 0 12px;font-size:14px}
.mrow{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
#ghost{position:fixed;pointer-events:none;z-index:200;opacity:.85;display:none}

/* ======= sharp corners everywhere ======= */
button,input,select,textarea,.palitem,.plist,.chip,.mbox,pre.code,textarea.code,
#crumb,#hint,.tabs .tab,#ghost .node{border-radius:0}

/* ======= blocks: black fill, 1px white border, white tag line ======= */
.node{background:#000;border:1px solid #fff;border-radius:0;box-shadow:none}
.node.sel{border-color:#fff;box-shadow:none;outline:1px solid #fff;outline-offset:3px}
.node.moving{outline:1px dashed #fff;outline-offset:3px}
.node.err{outline:1px solid var(--err);outline-offset:3px}
.node .hd,
.node.k-FB .hd,.node.k-F .hd,.node.k-io .hd,.node.k-var .hd,.node.k-const .hd{
  background:#fff;color:#000;border-bottom:0;border-radius:0;font-weight:600;letter-spacing:.2px}
.node .hd .badge,
.node.k-FB .hd .badge,.node.k-F .hd .badge{
  background:transparent;color:#000;border:1px solid #000;border-radius:0;font-weight:700}
.node .plabel{color:#fff;opacity:.75}
.node .pfield input{background:#000;border:1px solid #fff;color:#fff}
.port{width:10px;height:10px;background:#000;border:1px solid #fff;border-radius:50%;box-shadow:none}
.port.bool{border-radius:0}
.port:hover,.port.tgt{background:#fff;border-color:#fff;box-shadow:0 0 6px #fff}
.wire{stroke:#fff;stroke-width:1.25;stroke-linecap:butt;stroke-linejoin:miter}
.wire.back{stroke:#fff;stroke-dasharray:6 4}
.wire.sel{stroke:#fff;stroke-width:2.5}
.wlabel{fill:#fff;stroke:#14181f;stroke-width:3px}
.wlabel.backlabel{fill:#fff}
</style>
</head>
<body>
<div id="app">
<div id="top">
  <div class="brand">Flow<span>Py</span></div>
  <button id="bNew">New</button>
  <button id="bLoad">Open…</button>
  <button id="bSave">Save</button>
  <input id="fileIn" type="file" accept=".json" style="display:none">
  <div class="sep"></div>
  <button id="bConnect" class="pri">Connect device</button>
  <button id="bDeploy" class="ok" disabled>Deploy ▶</button>
  <button id="bPatch" disabled title="Push code changes without resetting state">Live patch ⚡</button>
  <button id="bStop" disabled>Stop ■</button>
  <div class="sep"></div>
  <button id="bSim">Simulate ▶</button>
  <select id="engine" title="simulation engine">
    <option value="auto">engine: auto</option>
    <option value="py">engine: Python (Pyodide, exact)</option>
    <option value="js">engine: fast (offline)</option>
  </select>
  <div class="sep"></div>
  <label style="display:flex;align-items:center;gap:4px"><input type="checkbox" id="cbVals" checked style="width:auto"> values</label>
  <div class="sp"></div>
  <button id="bHelp" title="help">?</button>
  <div id="status"><span class="dot" id="dot"></span><span id="statusTxt">idle</span></div>
</div>
<div id="main">
  <div id="left">
    <div class="panelhd">Blocks <span class="sp" style="flex:1"></span>
      <button id="bNewF" title="New stateless function">+F</button>
      <button id="bNewFB" title="New function block (stateful)">+FB</button>
    </div>
    <div class="scroll" style="flex:1"><div id="pal"></div></div>
  </div>
  <div id="center">
    <div id="cwrap">
      <div id="world">
        <svg id="wires"><g id="wireg" transform="translate(20000,20000)"></g></svg>
        <div id="nodes"></div>
      </div>
      <div id="crumb"></div>
      <div id="hint">drag a block → everything it feeds follows · alt-drag = move alone · <span style="color:#c9a4ff">right-to-left wire = next scan (z⁻¹)</span></div>
    </div>
    <div id="bottom">
      <div id="conhd"><b>Console</b><span id="rate"></span><span class="sp" style="flex:1"></span>
        <button id="bClear">clear</button><button id="bMin">▾</button></div>
      <div id="con" class="scroll"></div>
    </div>
  </div>
  <div id="right">
    <div class="tabs">
      <div class="tab on" data-t="insp">Inspector</div>
      <div class="tab" data-t="type">Type</div>
      <div class="tab" data-t="vars">Vars</div>
      <div class="tab" data-t="code">Code</div>
    </div>
    <div class="tabbody" id="tb-insp"></div>
    <div class="tabbody" id="tb-type" style="display:none"></div>
    <div class="tabbody" id="tb-vars" style="display:none"></div>
    <div class="tabbody" id="tb-code" style="display:none"></div>
  </div>
</div>
</div>
<div id="ghost"></div>
<div id="modal"><div class="mbox" id="mbox"></div></div>
<script>
/* =====================================================================
   FlowPy — model + builtin block library
   ===================================================================== */
'use strict';
const $  = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.from((r||document).querySelectorAll(s));
const el = (t,a,...kids)=>{const n=document.createElement(t);
  if(a) for(const k in a){ if(k==='cls')n.className=a[k]; else if(k==='html')n.innerHTML=a[k];
    else if(k.startsWith('on'))n.addEventListener(k.slice(2),a[k]); else if(a[k]!==null&&a[k]!==undefined)n.setAttribute(k,a[k]); }
  for(const c of kids.flat()) if(c!==null&&c!==undefined) n.append(c.nodeType?c:document.createTextNode(c));
  return n;};
let _uid = 1; const uid = p => (p||'x') + (_uid++);
const clone = o => JSON.parse(JSON.stringify(o));
const dedent = s => { const l=s.replace(/^\n/,'').replace(/\s+$/,'').split('\n');
  const ind = Math.min(...l.filter(x=>x.trim()).map(x=>x.match(/^ */)[0].length));
  return l.map(x=>x.slice(ind)).join('\n'); };

/* ---------- builtin block library -------------------------------- */
const P=(name,type,def,opts)=>Object.assign({name,type,def},opts||{});
const IO=(name,type)=>({name,type});
const B=[];
const def=(o)=>{o.builtin=true;o.impl='py';B.push(o);return o;};

/* --- stateless functions (F) --- */
def({id:'and',name:'AND',kind:'F',group:'Logic',ins:[IO('a','bool'),IO('b','bool')],outs:[IO('q','bool')],step:'return bool(a) and bool(b)'});
def({id:'or', name:'OR', kind:'F',group:'Logic',ins:[IO('a','bool'),IO('b','bool')],outs:[IO('q','bool')],step:'return bool(a) or bool(b)'});
def({id:'xor',name:'XOR',kind:'F',group:'Logic',ins:[IO('a','bool'),IO('b','bool')],outs:[IO('q','bool')],step:'return bool(a) != bool(b)'});
def({id:'not',name:'NOT',kind:'F',group:'Logic',ins:[IO('x','bool')],outs:[IO('q','bool')],step:'return not x'});

def({id:'add',name:'ADD',kind:'F',group:'Math',ins:[IO('a','num'),IO('b','num')],outs:[IO('y','num')],step:'return a + b'});
def({id:'sub',name:'SUB',kind:'F',group:'Math',ins:[IO('a','num'),IO('b','num')],outs:[IO('y','num')],step:'return a - b'});
def({id:'mul',name:'MUL',kind:'F',group:'Math',ins:[IO('a','num'),IO('b','num')],outs:[IO('y','num')],step:'return a * b'});
def({id:'div',name:'DIV',kind:'F',group:'Math',ins:[IO('a','num'),IO('b','num')],outs:[IO('y','num')],step:'return (a / b) if b else 0.0'});
def({id:'gt', name:'A > B',kind:'F',group:'Math',ins:[IO('a','num'),IO('b','num')],outs:[IO('q','bool')],step:'return a > b'});
def({id:'lt', name:'A < B',kind:'F',group:'Math',ins:[IO('a','num'),IO('b','num')],outs:[IO('q','bool')],step:'return a < b'});
def({id:'eq', name:'A == B',kind:'F',group:'Math',ins:[IO('a','any'),IO('b','any')],outs:[IO('q','bool')],step:'return a == b'});
def({id:'b2n',name:'BOOL→NUM',kind:'F',group:'Math',ins:[IO('b','bool')],outs:[IO('y','num')],step:'return 1 if b else 0'});
def({id:'sel',name:'SELECT',kind:'F',group:'Math',ins:[IO('s','bool'),IO('a','any'),IO('b','any')],outs:[IO('y','any')],step:'return a if s else b'});
def({id:'scale',name:'SCALE',kind:'F',group:'Math',params:[P('in_lo','num',0),P('in_hi','num',1),P('out_lo','num',0),P('out_hi','num',100)],
  ins:[IO('x','num')],outs:[IO('y','num')],step:dedent(`
    if in_hi == in_lo: return out_lo
    return out_lo + (x - in_lo) * (out_hi - out_lo) / (in_hi - in_lo)`)});
def({id:'clamp',name:'CLAMP',kind:'F',group:'Math',params:[P('lo','num',0),P('hi','num',1)],ins:[IO('x','num')],outs:[IO('y','num')],
  step:'return lo if x < lo else (hi if x > hi else x)'});

/* --- stateful function blocks (FB) --- */
def({id:'pin_in',name:'PIN IN',kind:'FB',group:'I/O',params:[P('pin','int',0),P('pull_up','bool',true),P('invert','bool',true)],
  outs:[IO('q','bool')],
  init:dedent(`
    self.p = Pin(pin, Pin.IN, Pin.PULL_UP) if pull_up else Pin(pin, Pin.IN)
    self.inv = invert`),
  step:dedent(`
    v = bool(self.p.value())
    return (not v) if self.inv else v`)});

def({id:'pin_out',name:'PIN OUT',kind:'FB',group:'I/O',params:[P('pin','int',2)],ins:[IO('d','bool')],outs:[],
  init:'self.p = Pin(pin, Pin.OUT)', step:'self.p.value(1 if d else 0)'});

def({id:'adc',name:'ADC',kind:'FB',group:'I/O',params:[P('pin','int',34)],outs:[IO('v','num')],
  init:dedent(`
    self.a = ADC(Pin(pin))
    try: self.a.atten(ADC.ATTN_11DB)
    except Exception: pass`),
  step:'return self.a.read_u16() / 65535.0'});

def({id:'pwm',name:'PWM',kind:'FB',group:'I/O',params:[P('pin','int',2),P('freq','int',1000)],ins:[IO('duty','num')],outs:[],
  init:dedent(`
    self.p = PWM(Pin(pin))
    try: self.p.freq(freq)
    except Exception: pass`),
  step:dedent(`
    d = 0.0 if duty < 0 else (1.0 if duty > 1 else duty)
    self.p.duty_u16(int(d * 65535))`)});

def({id:'blink',name:'BLINK',kind:'FB',group:'Time',params:[P('period_ms','int',500)],outs:[IO('q','bool')],
  init:'self.t = ticks_ms()\nself.q = False',
  step:dedent(`
    now = ticks_ms()
    if ticks_diff(now, self.t) >= period_ms // 2:
        self.t = now
        self.q = not self.q
    return self.q`)});

def({id:'ticks',name:'TICKS ms',kind:'FB',group:'Time',outs:[IO('ms','num')],init:'pass',step:'return ticks_ms()'});

def({id:'ton',name:'TIMER ON',kind:'FB',group:'Time',params:[P('pt_ms','int',1000)],ins:[IO('x','bool')],outs:[IO('q','bool'),IO('et','num')],
  init:'self.t0 = 0\nself.run = False',
  step:dedent(`
    if x:
        if not self.run:
            self.run = True
            self.t0 = ticks_ms()
        et = ticks_diff(ticks_ms(), self.t0)
        return (et >= pt_ms), et
    self.run = False
    return False, 0`)});

def({id:'counter',name:'COUNTER',kind:'FB',group:'Logic',ins:[IO('up','bool'),IO('rst','bool')],outs:[IO('n','num')],
  init:'self.n = 0\nself.last = False',
  step:dedent(`
    if up and not self.last:
        self.n += 1
    self.last = bool(up)
    if rst:
        self.n = 0
    return self.n`)});

def({id:'toggle',name:'TOGGLE',kind:'FB',group:'Logic',ins:[IO('t','bool')],outs:[IO('q','bool')],
  init:'self.q = False\nself.last = False',
  step:dedent(`
    if t and not self.last:
        self.q = not self.q
    self.last = bool(t)
    return self.q`)});

def({id:'edge',name:'EDGE',kind:'FB',group:'Logic',ins:[IO('x','bool')],outs:[IO('rise','bool'),IO('fall','bool')],
  init:'self.last = False',
  step:dedent(`
    x = bool(x)
    r = x and not self.last
    f = (not x) and self.last
    self.last = x
    return r, f`)});

const BUILTIN = {}; B.forEach(t=>BUILTIN[t.id]=t);

/* ---------- project ---------------------------------------------- */
function emptyProject(){
  return { name:'untitled', types:{}, vars:[], main:{nodes:[],wires:[]}, scan_ms:20, tele_ms:100 };
}
let P_ = emptyProject();

const typeOf = id => BUILTIN[id] || P_.types[id];

function newType(kind){

/* ---------- geometry (everything lives on the grid) --------------- */
const GRID=20, HDR=GRID, ROW=GRID;
const MINGAP=2*GRID;      // a downstream block sits at least two units clear of its source
const snap = v => Math.round(v/GRID)*GRID;
function portsOf(n){
  if(n.k==='blk'){ const t=typeOf(n.type); if(!t) return {ins:[],outs:[]};
    return {ins:(t.ins||[]).slice(), outs:(t.outs||[]).slice()}; }
  if(n.k==='const') return {ins:[], outs:[IO('', n.vtype||'num')]};
  if(n.k==='vget'){ const v=P_.vars.find(v=>v.name===n.varName); return {ins:[],outs:[IO('', v?v.type:'any')]}; }
  if(n.k==='vset'){ const v=P_.vars.find(v=>v.name===n.varName); return {ins:[IO('', v?v.type:'any')],outs:[]}; }
  if(n.k==='gin'){ const t=typeOf(n.owner); return {ins:[],outs:[IO(t&&t.ins[n.pi]?t.ins[n.pi].name:'?', t&&t.ins[n.pi]?t.ins[n.pi].type:'any')]}; }
  if(n.k==='gout'){ const t=typeOf(n.owner); return {ins:[IO(t&&t.outs[n.pi]?t.outs[n.pi].name:'?', t&&t.outs[n.pi]?t.outs[n.pi].type:'any')],outs:[]}; }
  return {ins:[],outs:[]};
}
function nodeTitle(n){
  if(n.k==='blk'){ const t=typeOf(n.type); return t?t.name:'?? '+n.type; }
  if(n.k==='const') return 'CONST';
  if(n.k==='vget') return '\u21a6 '+n.varName;
  if(n.k==='vset') return n.varName+' \u21a4';
  if(n.k==='gin') return 'IN';
  if(n.k==='gout') return 'OUT';
}
function nodeKindClass(n){
  if(n.k==='blk'){ const t=typeOf(n.type); return 'k-'+(t?t.kind:'F'); }
  if(n.k==='const') return 'k-const';
  if(n.k==='gin'||n.k==='gout') return 'k-io';
  return 'k-var';
}
function hasField(n){ return n.k==='const'; }
function nodeSize(n){
  const p=portsOf(n), rows=Math.max(p.ins.length,p.outs.length,1);
  let w = n.w || Math.max(120, nodeTitle(n).length*7.6+54);
  if(n.k==='blk'){ const t=typeOf(n.type);
    const lw = Math.max(...p.ins.map(x=>x.name.length),0)*6.5, rw=Math.max(...p.outs.map(x=>x.name.length),0)*6.5;
    w = Math.max(w, lw+rw+62, (t?t.name.length:4)*7.6+54); }
  w = Math.ceil(w/GRID)*GRID;                       // width is a whole number of cells
  let h = GRID*(rows+2);                            // header cell + one cell per port row + margin
  if(hasField(n)) h += GRID;
  return {w,h};
}
/* port centres always land on a grid intersection */
function portPos(n, side, i){
  const s=nodeSize(n);
  return { x: n.x + (side==='in'?0:s.w), y: n.y + GRID*(2+i) };
}
/* a wire that does not travel strictly left-to-right is a feedback wire:
   it carries the PREVIOUS scan's value. Because every forward wire strictly
   increases x, the forward-only graph can never contain a cycle. */
function wireBack(graph,w){
  const a=graph.nodes.find(n=>n.id===w.f[0]), b=graph.nodes.find(n=>n.id===w.t[0]);
  if(!a||!b) return false;
  return portPos(b,'in',w.t[1]).x <= portPos(a,'out',w.f[1]).x;
}
/* the wire's recorded type. Geometry decides it at creation; after that the
   editor guarantees geometry keeps agreeing (drags are clamped, widening
   blocks push their dependents right). */
function isBack(graph,w){ return (w.back===undefined)? wireBack(graph,w) : !!w.back; }
function tagWires(graph){ (graph.wires||[]).forEach(w=>{ if(w.back===undefined) w.back=wireBack(graph,w); }); }
function tagProject(p){ tagWires(p.main); Object.values(p.types||{}).forEach(t=>t.graph&&tagWires(t.graph)); }

/* --- moving a block carries everything it feeds ------------------- */
function forwardClosure(graph, seeds){
  const set=new Set(seeds), q=[...seeds];
  while(q.length){ const id=q.shift();
    for(const w of graph.wires){
      if(w.f[0]!==id || isBack(graph,w) || set.has(w.t[0])) continue;
      if(!graph.nodes.find(n=>n.id===w.t[0])) continue;
      set.add(w.t[0]); q.push(w.t[0]); } }
  return set;
}
/* how far the moving set may slide in x before some wire would change type */
function dxBounds(graph, movers){
  let lo=-Infinity, hi=Infinity;
  for(const w of graph.wires){
    const s=graph.nodes.find(n=>n.id===w.f[0]), d=graph.nodes.find(n=>n.id===w.t[0]);
    if(!s||!d) continue;
    const ms=movers.has(s.id), md=movers.has(d.id);
    if(ms===md) continue;                                   // both move, or neither
    const ox=portPos(s,'out',w.f[1]).x, ix=portPos(d,'in',w.t[1]).x;
    const back=isBack(graph,w);
    if(ms){ if(back) lo=Math.max(lo, ix-ox); else hi=Math.min(hi, ix-ox-MINGAP); }
    else  { if(back) hi=Math.min(hi, ox-ix); else lo=Math.max(lo, ox-ix+MINGAP); }
  }
  return {lo:Math.min(0,lo), hi:Math.max(0,hi)};   // a drag can always start
}
/* after a block changes width (ports added, renamed type) a forward wire can
   end up pointing backwards — push the dependent side right until it doesn't */
function enforceGeometry(graph){
  let moved=0;
  for(let pass=0; pass<24; pass++){
    let fixed=false;
    for(const w of graph.wires){
      if(isBack(graph,w)) continue;
      const s=graph.nodes.find(n=>n.id===w.f[0]), d=graph.nodes.find(n=>n.id===w.t[0]);
      if(!s||!d) continue;
      const ox=portPos(s,'out',w.f[1]).x, ix=portPos(d,'in',w.t[1]).x;
      if(ix>=ox+MINGAP) continue;
      const push=ox+MINGAP-ix;
      for(const id of forwardClosure(graph,[d.id])){ const n=graph.nodes.find(x=>x.id===id); if(n) n.x+=push; }
      fixed=true; moved++;
    }
    if(!fixed) break;
  }
  return moved;
}
function snapNode(n){ n.x=snap(n.x); n.y=snap(n.y); return n; }
function snapGraph(g){ (g.nodes||[]).forEach(snapNode); }
function snapProject(p){ snapGraph(p.main); Object.values(p.types||{}).forEach(t=>t.graph&&snapGraph(t.graph)); }

/* ---------- palette ---------------------------------------------- */
function renderPalette(){

    (groups[g]=groups[g]||[]).push(t); }

function startPaletteDrag(e,kind,t){

    <div class="hd"><span class="ttl">${t.name}</span></div><div class="body" style="height:26px"></div></div>`;
  g.style.display='block'; ghostDrag={kind,t};
  const mv=ev=>{g.style.left=(ev.clientX-20)+'px'; g.style.top=(ev.clientY-12)+'px';};

function addNode(kind,t,x,y){
  const g=G(); const n={id:uid('n'),k:kind,x:snap(x),y:snap(y)};
  if(kind==='blk'){ n.type=t.id; n.params={}; (t.params||[]).forEach(p=>n.params[p.name]=p.def); }

/* ---------- graph render ----------------------------------------- */
function syncIONodes(){ const t=curType(); if(t) syncIOFor(t); }
function renderGraph(){
  syncIONodes();

function buildNode(n){
  const s=nodeSize(n), p=portsOf(n);

  const body=el('div',{cls:'body'});
  p.ins.forEach((pt,i)=>{

    body.append(el('div',{cls:'port'+(pt.type==='bool'?' bool':''),style:`left:-5px;top:${y-5}px`,'data-n':n.id,'data-s':'in','data-i':i,title:pt.name+':'+pt.type}));
    if(pt.name) body.append(el('div',{cls:'plabel',style:`left:12px;top:${y-7}px`},pt.name)); });
  p.outs.forEach((pt,i)=>{
    const y=GRID*(2+i)-HDR;
    body.append(el('div',{cls:'port'+(pt.type==='bool'?' bool':''),style:`left:${s.w-5}px;top:${y-5}px`,'data-n':n.id,'data-s':'out','data-i':i,title:pt.name+':'+pt.type}));
    if(pt.name) body.append(el('div',{cls:'plabel',style:`right:12px;top:${y-7}px;text-align:right`},pt.name)); });
  if(hasField(n)){
    const rows=Math.max(p.ins.length,p.outs.length,1);
    const f=el('input',{value:String(n.value),title:'python literal'});
    f.addEventListener('change',()=>{ n.value=f.value; n.vtype=guessType(f.value); renderGraph(); markDirty(); });
    f.addEventListener('mousedown',e=>e.stopPropagation());
    body.append(el('div',{cls:'pfield',style:`top:${GRID*(rows+1)-HDR+1}px`},f));
  }
  d.append(body);
  return d;
}
function guessType(v){ const s=String(v).trim();
  if(s==='True'||s==='False') return 'bool';
  if(/^-?[\d.]+$/.test(s)) return 'num'; return 'any'; }

const NS='http://www.w3.org/2000/svg';
function buildWire(w){
  const g=document.createElementNS(NS,'g'); g.setAttribute('data-id',w.id);
  g.innerHTML=`<path class="hit"></path><path class="wire"></path><text class="wlabel" text-anchor="middle"></text>`;
  g.querySelector('.hit').addEventListener('mousedown',e=>{e.stopPropagation(); selectWire(w.id);});
  g.querySelector('.hit').addEventListener('dblclick',e=>{e.stopPropagation(); delWire(w.id);});
  return g;
}
function slotKey(nodeId,port){ return nodeId+':'+port; }
function updateWires(fast){
  const g=G();
  for(const w of g.wires){
    const a=nodeById(w.f[0]), b=nodeById(w.t[0]); if(!a||!b) continue;
    const p1=portPos(a,'out',w.f[1]), p2=portPos(b,'in',w.t[1]);
    const grp=wireg.querySelector(`g[data-id="${w.id}"]`); if(!grp) continue;
    const back = isBack(g,w);
    const d = (!fast && ROUTES[w.id]) ? ROUTES[w.id] : quickPath(p1,p2,back);
    grp.querySelector('.hit').setAttribute('d',d);
    const path=grp.querySelector('.wire'); path.setAttribute('d',d);
    const po=portsOf(a).outs[w.f[1]]; const ty=po?po.type:'any';
    const key=slotKey(w.f[0],w.f[1]);
    const has=(key in LIVE);
    const v=LIVE[key];
    path.setAttribute('class','wire'+(back?' back':'')+(sel.wires.has(w.id)?' sel':''));
    if(has){ const c=valColor(v,ty,key); path.style.stroke=c.stroke; path.style.strokeWidth=c.width;
      path.style.filter=c.glow?'drop-shadow(0 0 4px '+c.stroke+')':''; }
    else { path.style.stroke=''; path.style.strokeWidth=''; path.style.filter=''; }
    const tx=grp.querySelector('text');
    const label = (back?'\u21ba z\u207b\u00b9':'') + (has&&showVals?(back?' ':'')+fmt(v):'');
    if(label){ tx.textContent=label;
      let mid={x:(p1.x+p2.x)/2, y:(p1.y+p2.y)/2};
      try{ const L=path.getTotalLength(); if(L>0) mid=path.getPointAtLength(L*0.5); }catch(e){}
      tx.setAttribute('x',mid.x); tx.setAttribute('y',mid.y-6);
      tx.setAttribute('class','wlabel'+(back?' backlabel':'')); tx.style.display=''; }
    else tx.style.display='none';
  }
}
const fmt=v=> (typeof v==='boolean')?(v?'TRUE':'FALSE') : (typeof v==='number'? (Number.isInteger(v)?String(v):v.toFixed(3)) : String(v));
function lerpHex(a,b,t){ const p=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
  const A=p(a),Bb=p(b); return '#'+A.map((v,i)=>Math.round(v+(Bb[i]-v)*t).toString(16).padStart(2,'0')).join(''); }
function ramp(t){ t=Math.max(0,Math.min(1,t));
  return t<0.5? lerpHex('#1e5fd0','#f5b23f',t*2) : lerpHex('#f5b23f','#ff4d4d',(t-0.5)*2); }
function valColor(v,type,key){
  if(typeof v==='boolean'||type==='bool') return v?{stroke:'#22e06a',width:3,glow:true}:{stroke:'#2f4a3c',width:2,glow:false};
  if(typeof v==='number'){
    const r=RANGE[key]||(RANGE[key]={lo:v,hi:v});
    r.lo=Math.min(r.lo,v); r.hi=Math.max(r.hi,v);
    const sp=r.hi-r.lo; const t=sp>1e-9?(v-r.lo)/sp:0.5;
    return {stroke:ramp(t),width:2+t*1.6,glow:t>0.7};
  }
  return {stroke:'#7c8aa0',width:2,glow:false};
}

/* ---------- selection & editing ---------------------------------- */
function selectOnly(id){ sel.nodes=new Set(id?[id]:[]); sel.wires=new Set(); refreshSel(); }
function selectWire(id){ sel.nodes=new Set(); sel.wires=new Set([id]); refreshSel(); }
function refreshSel(){
  $$('.node').forEach(d=>d.classList.toggle('sel',sel.nodes.has(d.dataset.id)));
  updateWires(); renderInspector();
}
function delWire(id){ const g=G(); g.wires=g.wires.filter(w=>w.id!==id); renderGraph(); markDirty(); }
function delSelection(){
  const g=G();
  const ids=[...sel.nodes].filter(id=>{const n=nodeById(id); return n && n.k!=='gin' && n.k!=='gout';});
  g.nodes=g.nodes.filter(n=>!ids.includes(n.id));
  g.wires=g.wires.filter(w=>!ids.includes(w.f[0])&&!ids.includes(w.t[0])&&!sel.wires.has(w.id));
  selectOnly(null); renderGraph(); markDirty();
}
function connect(fn,fi,tn,ti){
  const g=G();
  if(fn===tn) return;
  g.wires=g.wires.filter(w=>!(w.t[0]===tn&&w.t[1]===ti));   // one source per input
  const w={id:uid('w'),f:[fn,fi],t:[tn,ti]};
  w.back=wireBack(g,w);
  g.wires.push(w);
  renderGraph(); markDirty();
}

document.addEventListener('mousemove',e=>{
  if(!drag) return;
  if(drag.type==='pan'){ cam.x=drag.cx+(e.clientX-drag.x0); cam.y=drag.cy+(e.clientY-drag.y0); applyCam(); }
  else if(drag.type==='node'){ const p=toGraph(e.clientX,e.clientY);
    let dx=snap(p.x-drag.p0.x); const dy=snap(p.y-drag.p0.y); drag.moved=true;
    const cl=Math.max(drag.bounds.lo, Math.min(drag.bounds.hi, dx));

        toast('held by a wire — a block cannot cross a block it exchanges signals with (Alt-drag to move it alone)'); } }
    else drag.clamped=false;

/* =====================================================================
   FlowPy — orthogonal wire router
   Wires are straight segments on the grid. An A* search over free grid
   points (nodes are obstacles, already-used cells cost extra) picks the
   route; turns are penalised so paths come out as long straight runs.
   ===================================================================== */
const ROUTES={};            // wireId -> svg path string
const TURN=4, USEDCOST=3, PAD=12*GRID, MAXCELLS=60000, LEFTBIAS=0.15;

function obstaclesOf(graph){
  return graph.nodes.map(n=>{ const s=nodeSize(n);
    return {x0:n.x, y0:n.y, x1:n.x+s.w, y1:n.y+s.h}; });
}
function blocked(obs,x,y){
  for(let k=0;k<obs.length;k++){ const o=obs[k];
    if(x>=o.x0&&x<=o.x1&&y>=o.y0&&y<=o.y1) return true; }
  return false;
}
/* --- min-heap ------------------------------------------------------- */
function Heap(){ this.a=[]; }
Heap.prototype.push=function(v){ const a=this.a; a.push(v); let i=a.length-1;
  while(i>0){ const p=(i-1)>>1; if(a[p].f<=a[i].f) break; [a[p],a[i]]=[a[i],a[p]]; i=p; } };
Heap.prototype.pop=function(){ const a=this.a, top=a[0], last=a.pop();
  if(a.length){ a[0]=last; let i=0; for(;;){ const l=2*i+1,r=l+1; let m=i;
    if(l<a.length&&a[l].f<a[m].f)m=l; if(r<a.length&&a[r].f<a[m].f)m=r; if(m===i)break; [a[m],a[i]]=[a[i],a[m]]; i=m; } }
  return top; };
Heap.prototype.size=function(){ return this.a.length; };

const DX=[GRID,0,-GRID,0], DY=[0,GRID,0,-GRID];   // 0:→ 1:↓ 2:← 3:↑

function aStar(s,t,obs,used){
  const minX=Math.min(s.x,t.x)-PAD, maxX=Math.max(s.x,t.x)+PAD;
  const minY=Math.min(s.y,t.y)-PAD, maxY=Math.max(s.y,t.y)+PAD;
  const nx=(maxX-minX)/GRID+1, ny=(maxY-minY)/GRID+1;
  if(nx*ny>MAXCELLS) return null;
  const h=(x,y)=>(Math.abs(x-t.x)+Math.abs(y-t.y))/GRID;
  const seen={}, open=new Heap();
  open.push({x:s.x,y:s.y,d:0,g:0,f:h(s.x,s.y),p:null});
  seen[s.x+','+s.y+','+0]=0;
  let best=null, guard=0;
  while(open.size()&&guard++<MAXCELLS*2){
    const c=open.pop();
    if(c.x===t.x&&c.y===t.y){ best=c; break; }
    for(let d=0;d<4;d++){
      const nx2=c.x+DX[d], ny2=c.y+DY[d];
      if(nx2<minX||nx2>maxX||ny2<minY||ny2>maxY) continue;
      if(blocked(obs,nx2,ny2)) continue;
      const vert=(d===1||d===3);
      const g=c.g+1+(d===c.d?0:TURN)+(used[nx2+','+ny2]||0)*USEDCOST
              +(vert? LEFTBIAS*(nx2-minX)/(maxX-minX+GRID) : 0);   // keep vertical runs to the left
      const k=nx2+','+ny2+','+d;
      if(seen[k]!==undefined&&seen[k]<=g) continue;
      seen[k]=g;
      open.push({x:nx2,y:ny2,d,g,f:g+h(nx2,ny2),p:c});
    }
  }
  if(!best) return null;
  const pts=[]; for(let c=best;c;c=c.p) pts.push({x:c.x,y:c.y});
  return pts.reverse();
}
function simplify(pts){
  const o=[pts[0]];
  for(let i=1;i<pts.length-1;i++){
    const a=o[o.length-1], b=pts[i], c=pts[i+1];
    if((a.x===b.x&&b.x===c.x)||(a.y===b.y&&b.y===c.y)) continue;   // collinear
    o.push(b);
  }
  o.push(pts[pts.length-1]);
  return o;
}
/* every corner becomes a 45 degree cut, half a unit by half a unit:
   stub -> chamfer -> shaft -> chamfer -> stub */
const CHAMF=GRID/2;
function polyPath(pts){
  if(pts.length<3) return 'M'+pts.map(p=>p.x+','+p.y).join(' L');
  let d='M'+pts[0].x+','+pts[0].y;
  for(let i=1;i<pts.length-1;i++){
    const a=pts[i-1], b=pts[i], c=pts[i+1];
    const l1=Math.hypot(b.x-a.x,b.y-a.y), l2=Math.hypot(c.x-b.x,c.y-b.y);
    const k1=Math.min(CHAMF,l1/2)/(l1||1), k2=Math.min(CHAMF,l2/2)/(l2||1);
    d+=' L'+(b.x+(a.x-b.x)*k1)+','+(b.y+(a.y-b.y)*k1);
    d+=' L'+(b.x+(c.x-b.x)*k2)+','+(b.y+(c.y-b.y)*k2);
  }
  const e=pts[pts.length-1];
  return d+' L'+e.x+','+e.y;
}
/* the canonical forward route: vertical shaft pushed as far left as it goes,
   one unit clear of the output port */
function directPts(p1,p2){
  if(p1.y===p2.y) return [p1,p2];
  const sx=p1.x+GRID;
  if(sx>p2.x-GRID) return null;                       // not enough room
  return [p1,{x:sx,y:p1.y},{x:sx,y:p2.y},p2];
}
function pathClear(pts,obs){
  for(let i=0;i<pts.length-1;i++){
    const a=pts[i], b=pts[i+1];
    const sx=Math.sign(b.x-a.x)*GRID, sy=Math.sign(b.y-a.y)*GRID;
    let x=a.x, y=a.y, guard=0;
    while((x!==b.x||y!==b.y)&&guard++<3000){
      x+=sx; y+=sy;
      if(x===b.x&&y===b.y&&i===pts.length-2) break;   // last point sits on the target's edge
      if(blocked(obs,x,y)) return false;
    }
  }
  return true;
}
function quickPath(p1,p2,back){
  if(!back){
    const d=directPts(p1,p2);
    if(d) return polyPath(d);
    const mx=snap((p1.x+p2.x)/2);
    return polyPath(simplify([p1,{x:mx,y:p1.y},{x:mx,y:p2.y},p2]));
  }
  const y=Math.min(p1.y,p2.y)-GRID*2;
  return polyPath(simplify([p1,{x:p1.x+GRID,y:p1.y},{x:p1.x+GRID,y},{x:p2.x-GRID,y},{x:p2.x-GRID,y:p2.y},p2]));
}
function markUsed(used,pts){
  for(let i=1;i<pts.length;i++){
    const a=pts[i-1], b=pts[i];
    const sx=Math.sign(b.x-a.x)*GRID, sy=Math.sign(b.y-a.y)*GRID;
    let x=a.x, y=a.y, guard=0;
    while((x!==b.x||y!==b.y)&&guard++<4000){ used[x+','+y]=(used[x+','+y]||0)+1; x+=sx; y+=sy; }
    used[b.x+','+b.y]=(used[b.x+','+b.y]||0)+1;
  }
}
function routeWire(graph,w,obs,used){
  const a=graph.nodes.find(n=>n.id===w.f[0]), b=graph.nodes.find(n=>n.id===w.t[0]);
  if(!a||!b) return '';
  const p1=portPos(a,'out',w.f[1]), p2=portPos(b,'in',w.t[1]);
  const back=isBack(graph,w);
  if(!back){
    const dp=directPts(p1,p2);
    if(dp&&pathClear(dp,obs)){ markUsed(used,dp); return polyPath(dp); }
    if(p2.x-p1.x<=2*GRID) return quickPath(p1,p2,false);
  }
  const s={x:p1.x+GRID,y:p1.y}, t={x:p2.x-GRID,y:p2.y};
  let pts=null;
  if(!blocked(obs,s.x,s.y)&&!blocked(obs,t.x,t.y)) pts=aStar(s,t,obs,used);
  if(!pts) return quickPath(p1,p2,back);
  const full=simplify([p1,...pts,p2]);
  markUsed(used,full);
  return polyPath(full);
}
function rerouteAll(){
  const g=G(), obs=obstaclesOf(g), used={};
  const order=g.wires.slice().sort((x,y)=>wLen(g,x)-wLen(g,y));
  for(const w of order) ROUTES[w.id]=routeWire(g,w,obs,used);
  updateWires();
}
function wLen(g,w){
  const a=g.nodes.find(n=>n.id===w.f[0]), b=g.nodes.find(n=>n.id===w.t[0]);
  if(!a||!b) return 0;
  const p1=portPos(a,'out',w.f[1]), p2=portPos(b,'in',w.t[1]);
  return Math.abs(p1.x-p2.x)+Math.abs(p1.y-p2.y);
}
/* =====================================================================
   FlowPy — MicroPython code generator
   ===================================================================== */
const GEN={full:'',patch:'',blocks:{},mainBlock:null,pathInfo:{},instPaths:{},nw:0,err:null};

const pid = s => String(s).replace(/\W/g,'_');
const cname = t => (t.impl==='graph'?'G_':(t.kind==='FB'?'FB_':'F_'))+pid(t.id);
const outVar = (n,i)=> 'v'+pid(n.id)+'_'+i;
function pyLit(v,type){
  if(type==='str') return JSON.stringify(String(v??''));
  if(type==='bool') return (v===true||v==='true'||v===1)?'True':'False';
  if(type==='int'){ const x=parseInt(v); return String(isNaN(x)?0:x); }
  const x=Number(v); return String(isNaN(x)?0:x);
}
function ind(s,n){ const p=' '.repeat(n); const b=String(s??'').replace(/\t/g,'    ');
  if(!b.trim()) return p+'pass';
  return b.split('\n').map(l=>l.trim()===''?'':p+l).join('\n'); }

function syncIOFor(t){
  const g=t.graph||(t.graph={nodes:[],wires:[]}); const keep=[];
  (t.ins||[]).forEach((p,i)=>{ let n=g.nodes.find(n=>n.k==='gin'&&n.pi===i);
    if(!n){ n={id:uid('n'),k:'gin',pi:i,owner:t.id,x:-180,y:40+i*80}; g.nodes.push(n);} n.owner=t.id; keep.push(n.id); });
  (t.outs||[]).forEach((p,i)=>{ let n=g.nodes.find(n=>n.k==='gout'&&n.pi===i);
    if(!n){ n={id:uid('n'),k:'gout',pi:i,owner:t.id,x:480,y:40+i*80}; g.nodes.push(n);} n.owner=t.id; keep.push(n.id); });
  const dead=g.nodes.filter(n=>(n.k==='gin'||n.k==='gout')&&!keep.includes(n.id)).map(n=>n.id);
  if(dead.length){ g.nodes=g.nodes.filter(n=>!dead.includes(n.id));
    g.wires=g.wires.filter(w=>!dead.includes(w.f[0])&&!dead.includes(w.t[0])); }
}

/* ---- slot layout ------------------------------------------------- */
function graphBlock(graph,seen){
  let off=0; const local={}, child={};
  for(const n of graph.nodes) portsOf(n).outs.forEach((p,i)=>{ local[n.id+':'+i]=off++; });
  for(const n of graph.nodes){ if(n.k!=='blk') continue; const t=typeOf(n.type);
    if(t&&!t.builtin&&t.impl==='graph'){ const b=blockOf(t.id,seen); child[n.id]=off; off+=b.size; } }
  return {size:off,local,child};
}
function blockOf(typeId,seen){
  seen=seen||new Set();
  if(GEN.blocks[typeId]) return GEN.blocks[typeId];
  if(seen.has(typeId)) throw new Error('recursive block type: '+(P_.types[typeId]||{}).name);
  seen.add(typeId);
  const t=P_.types[typeId]; if(!t) throw new Error('missing type '+typeId);
  const b=graphBlock(t.graph||{nodes:[],wires:[]},seen);
  seen.delete(typeId); GEN.blocks[typeId]=b; return b;
}

/* ---- graph body emitter ------------------------------------------ */
let BACKW=new Set();                       // wire ids evaluated from last scan
const zVar = (nid,i)=> 'z'+pid(nid)+'_'+i;
const zAttr= (nid,i)=> '_z'+pid(nid)+'_'+i;
function inExpr(graph,n,i){
  const w=graph.wires.find(w=>w.t[0]===n.id&&w.t[1]===i);
  if(w){ const s=graph.nodes.find(x=>x.id===w.f[0]);
    if(s) return BACKW.has(w.id)? zVar(s.id,w.f[1]) : outVar(s,w.f[1]); }
  const p=portsOf(n).ins[i];
  return (p&&p.type==='bool')?'False':'0';
}
/* every output port that feeds at least one right-to-left wire */
function zPorts(graph){
  const m=new Map();
  for(const w of graph.wires){
    if(!isBack(graph,w)) continue;
    const s=graph.nodes.find(x=>x.id===w.f[0]); if(!s) continue;
    const p=portsOf(s).outs[w.f[1]];
    m.set(w.f[0]+':'+w.f[1], {nid:w.f[0], i:w.f[1], type:p?p.type:'any'});
  }
  return [...m.values()];
}
function isBreaker(n){ if(n.k!=='blk') return false; const t=typeOf(n.type); return !!(t&&t.breaker); }

function emitGraph(graph,block,ctx){
  const L=[]; const post=[];
  const nodes=graph.nodes;
  BACKW=new Set(graph.wires.filter(w=>isBack(graph,w)).map(w=>w.id));
  const zs=zPorts(graph);
  for(const z of zs) L.push(`${zVar(z.nid,z.i)} = self.${zAttr(z.nid,z.i)}`);
  /* topological order, ignoring edges into breaker nodes */
  const deg={}, adj={};
  nodes.forEach(n=>{deg[n.id]=0;adj[n.id]=[];});
  for(const w of graph.wires){
    const d=nodes.find(n=>n.id===w.t[0]), s=nodes.find(n=>n.id===w.f[0]);
    if(!d||!s||isBreaker(d)||BACKW.has(w.id)) continue;   // back wires are not dependencies
    adj[s.id].push(d.id); deg[d.id]++;
  }
  const q=nodes.filter(n=>deg[n.id]===0).map(n=>n.id); const order=[];
  while(q.length){ const id=q.shift(); order.push(id);
    for(const m of adj[id]) if(--deg[m]===0) q.push(m); }
  if(order.length!==nodes.length){
    const bad=nodes.filter(n=>!order.includes(n.id)).map(n=>nodeTitle(n)).join(', ');
    throw new Error('unresolvable loop (blocks overlap?): '+bad);
  }
  const slot=(n,i)=>block.local[n.id+':'+i];
  const wr=(n,i,expr)=>{ const o=slot(n,i); if(o===undefined) return null;
    const p=portsOf(n).outs[i]; const num=(p&&p.type!=='bool');
    return `W[_b+${o}] = `+(num?`_r(${expr})`:expr); };

  /* breaker pre-reads first */
  for(const n of nodes){ if(!isBreaker(n)) continue;
    const t=typeOf(n.type); const vs=(t.outs||[]).map((p,i)=>outVar(n,i));
    L.push(`${vs.join(', ')} = self.${pid(n.id)}.pre()`);
    (t.outs||[]).forEach((p,i)=>{const s=wr(n,i,outVar(n,i)); if(s)L.push(s);});
    const ins=(t.ins||[]).map((p,i)=>inExpr(graph,n,i));
    post.push(`self.${pid(n.id)}.post(${ins.join(', ')})`);
  }
  const outsExpr=[];
  for(const id of order){
    const n=nodes.find(x=>x.id===id); if(isBreaker(n)) continue;
    if(n.k==='const'){ L.push(`${outVar(n,0)} = ${String(n.value).trim()||'0'}`); const s=wr(n,0,outVar(n,0)); if(s)L.push(s); continue; }
    if(n.k==='gin'){ L.push(`${outVar(n,0)} = ${ctx.args[n.pi]}`); const s=wr(n,0,outVar(n,0)); if(s)L.push(s); continue; }
    if(n.k==='gout'){ outsExpr[n.pi]=inExpr(graph,n,0); continue; }
    if(n.k==='vget'){ L.push(`${outVar(n,0)} = V.${pid(n.varName)}`); const s=wr(n,0,outVar(n,0)); if(s)L.push(s); continue; }
    if(n.k==='vset'){ L.push(`V.${pid(n.varName)} = ${inExpr(graph,n,0)}`); continue; }
    if(n.k!=='blk') continue;
    const t=typeOf(n.type); if(!t) throw new Error('node '+n.id+' has unknown type');
    const ins=(t.ins||[]).map((p,i)=>inExpr(graph,n,i));
    const outs=t.outs||[];
    let call;
    if(t.impl==='graph') call=`self.${pid(n.id)}.step(_b+${block.child[n.id]}${ins.length?', '+ins.join(', '):''})`;
    else if(t.kind==='FB') call=`self.${pid(n.id)}.step(${ins.join(', ')})`;
    else { const ps=(t.params||[]).map(p=>pyLit(n.params?n.params[p.name]:p.def,p.type));
           call=`F_${pid(t.id)}(${ps.concat(ins).join(', ')})`; }
    if(outs.length===0) L.push(call);
    else L.push(`${outs.map((p,i)=>outVar(n,i)).join(', ')} = ${call}`);
    outs.forEach((p,i)=>{const s=wr(n,i,outVar(n,i)); if(s)L.push(s);});
  }
  L.push(...post);
  for(const z of zs) L.push(`self.${zAttr(z.nid,z.i)} = ${outVar({id:z.nid},z.i)}`);
  if(ctx.returns){ const vals=(ctx.returns).map((p,i)=>outsExpr[i]!==undefined?outsExpr[i]:(p.type==='bool'?'False':'0'));
    if(vals.length) L.push('return '+vals.join(', ')); }
  return L.length?L:['pass'];
}

function emitEnsure(graph,fname){
  const L=[];
  for(const z of zPorts(graph))
    L.push(`if not hasattr(self, '${zAttr(z.nid,z.i)}'): self.${zAttr(z.nid,z.i)} = ${z.type==='bool'?'False':'0'}`);
  for(const n of graph.nodes){ if(n.k!=='blk') continue; const t=typeOf(n.type); if(!t||t.kind==='F'&&t.impl!=='graph') continue;
    const cn=cname(t);
    if(t.impl==='graph'){ L.push(`if not hasattr(self, '${pid(n.id)}'): self.${pid(n.id)} = ${cn}()`);
      L.push(`self.${pid(n.id)}.ensure()`); }
    else { const ps=(t.params||[]).map(p=>pyLit(n.params?n.params[p.name]:p.def,p.type));
      L.push(`if not hasattr(self, '${pid(n.id)}'): self.${pid(n.id)} = ${cn}(${ps.join(', ')})`); }
  }
  return L.length?L:['pass'];
}

/* ---- collect reachable types -------------------------------------- */
function collectTypes(graph,set){
  for(const n of graph.nodes){ if(n.k!=='blk') continue; const t=typeOf(n.type); if(!t||set.has(t.id)) continue;
    set.add(t.id); if(t.impl==='graph') collectTypes(t.graph||{nodes:[],wires:[]},set); }
  return set;
}

/* ---- full generation ---------------------------------------------- */
function generate(){
  GEN.blocks={}; GEN.pathInfo={}; GEN.instPaths={}; GEN.err=null;
  Object.values(P_.types).forEach(syncIOFor); tagProject(P_);
  const used=collectTypes(P_.main,new Set());
  GEN.mainBlock=graphBlock(P_.main,new Set());
  GEN.varBase=GEN.mainBlock.size;
  (function walk(graph,base,path,typeId){
    GEN.pathInfo[path]={typeId,base};
    if(typeId)(GEN.instPaths[typeId]=GEN.instPaths[typeId]||[]).push(path);
    const block=typeId?GEN.blocks[typeId]:GEN.mainBlock;
    for(const n of graph.nodes){ if(n.k!=='blk')continue; const t=typeOf(n.type);
      if(t&&!t.builtin&&t.impl==='graph') walk(t.graph,base+block.child[n.id],(path?path+'/':'')+n.id,t.id); }
  })(P_.main,0,'',null);
  GEN.nw=GEN.varBase+P_.vars.length;

  const defs=[];
  for(const id of used){
    const t=typeOf(id);
    if(t.impl==='graph'){
      const cn=cname(t), b=blockOf(t.id);
      defs.push(`try:\n    ${cn}\nexcept NameError:\n    class ${cn}:\n        def __init__(self):\n            self.ensure()`);
      defs.push(`def _${cn}_ensure(self):\n${ind(emitEnsure(t.graph).join('\n'),4)}\n${cn}.ensure = _${cn}_ensure`);
      const args=(t.ins||[]).map((p,i)=>'i'+i);
      const body=emitGraph(t.graph,b,{args,returns:t.outs||[]});
      defs.push(`def _${cn}_step(self, _b${args.length?', '+args.join(', '):''}):\n${ind(body.join('\n'),4)}\n${cn}.step = _${cn}_step`);
    } else if(t.kind==='FB'){
      const cn=cname(t);
      const ps=(t.params||[]).map(p=>`${p.name}=${pyLit(p.def,p.type)}`);
      defs.push(`try:\n    ${cn}\nexcept NameError:\n    class ${cn}:\n        def __init__(self${ps.length?', '+ps.join(', '):''}):\n${ind(t.init||'pass',12)}\n${ind((t.params||[]).map(p=>`self._${p.name} = ${p.name}`).join('\n')||'pass',12)}`);
      const pu=(t.params||[]).map(p=>`${p.name} = self._${p.name}`).join('\n');
      if(t.breaker){
        defs.push(`def _${cn}_pre(self):\n${pu?ind(pu,4)+'\n':''}${ind(t.pre||'return self.q',4)}\n${cn}.pre = _${cn}_pre`);
        defs.push(`def _${cn}_post(self${(t.ins||[]).length?', '+(t.ins||[]).map(p=>p.name).join(', '):''}):\n${pu?ind(pu,4)+'\n':''}${ind(t.post||'self.q = x',4)}\n${cn}.post = _${cn}_post`);
      } else {
        defs.push(`def _${cn}_step(self${(t.ins||[]).length?', '+(t.ins||[]).map(p=>p.name).join(', '):''}):\n${pu?ind(pu,4)+'\n':''}${ind(t.step||'pass',4)}\n${cn}.step = _${cn}_step`);
      }
    } else {
      const args=(t.params||[]).map(p=>p.name).concat((t.ins||[]).map(p=>p.name));
      defs.push(`def F_${pid(t.id)}(${args.join(', ')}):\n${ind(t.step||'pass',4)}`);
    }
  }
  const mainBody=emitGraph(P_.main,GEN.mainBlock,{args:[],returns:null});
  P_.vars.forEach((v,i)=>mainBody.push(`W[${GEN.varBase+i}] = _r(V.${pid(v.name)})`));
  const vinit=P_.vars.map(v=>`if not hasattr(V, '${pid(v.name)}'): V.${pid(v.name)} = ${String(v.init).trim()||'0'}`);

  const head = PRELUDE.replace('__NW__',String(Math.max(1,GEN.nw)));
  const varsrc = `class _V:\n    pass\ntry:\n    V\nexcept NameError:\n    V = _V()\ndef _vinit():\n${ind(vinit.join('\n')||'pass',4)}\n_vinit()`;
  const mainsrc = [
    `try:\n    Main\nexcept NameError:\n    class Main:\n        def __init__(self):\n            self.ensure()`,
    `def _Main_ensure(self):\n${ind(emitEnsure(P_.main).join('\n'),4)}\nMain.ensure = _Main_ensure`,
    `def _Main_step(self):\n    _b = 0\n${ind(mainBody.join('\n'),4)}\nMain.step = _Main_step`
  ].join('\n\n');

  const body=[head,varsrc,'# ---- block types ----',defs.join('\n\n'),'# ---- main diagram ----',mainsrc].join('\n\n');
  GEN.full = body+'\n\n'+RUNTIME+`\n\nM = Main()\nrun(${P_.scan_ms|0}, ${P_.tele_ms|0})\n`;
  GEN.sim  = body+'\n\n'+RUNTIME+'\n\nM = Main()\n';
  GEN.patch = body+'\n\nM.ensure()\n';
  return GEN;
}

/* --- graph interpreter ---------------------------------------------- */
function topoOrder(graph,back){
  const deg={},adj={}; graph.nodes.forEach(n=>{deg[n.id]=0;adj[n.id]=[];});
  for(const w of graph.wires){ const d=graph.nodes.find(n=>n.id===w.t[0]),s=graph.nodes.find(n=>n.id===w.f[0]);
    if(!d||!s||isBreaker(d)||(back&&back.has(w.id)))continue; adj[s.id].push(d.id); deg[d.id]++; }
  const q=graph.nodes.filter(n=>deg[n.id]===0).map(n=>n.id),o=[];
  while(q.length){const id=q.shift();o.push(id);for(const m of adj[id])if(--deg[m]===0)q.push(m);}
  return o;
}
function jsRun(graph,block,path,base,args){
  const V={},outs=[],posts=[];
  const st=id=>JSSTATE[path+'|'+id]||(JSSTATE[path+'|'+id]={});
  const wr=(n,i,v)=>{const o=block.local[n.id+':'+i]; if(o!==undefined)JSW[base+o]=v;};
  const back=new Set(graph.wires.filter(w=>isBack(graph,w)).map(w=>w.id));
  const zkeys=[...new Set(graph.wires.filter(w=>back.has(w.id)).map(w=>w.f[0]+':'+w.f[1]))];
  const inV=(n,i)=>{ const w=graph.wires.find(w=>w.t[0]===n.id&&w.t[1]===i);
    const p=portsOf(n).ins[i], dflt=(p&&p.type==='bool')?false:0;
    if(w&&back.has(w.id)){ const zk=path+'|z|'+w.f[0]+':'+w.f[1]; return (zk in JSZ)?JSZ[zk]:dflt; }
    if(w&&(w.f[0]+':'+w.f[1]) in V) return V[w.f[0]+':'+w.f[1]];
    return dflt; };
  for(const n of graph.nodes){ if(!isBreaker(n))continue; const t=typeOf(n.type);
    const impl=JSB[t.id]; const o=impl&&impl.pre?impl.pre(n.params,[],st(n.id)):[0];
    (t.outs||[]).forEach((p,i)=>{V[n.id+':'+i]=o[i];wr(n,i,o[i]);});
    posts.push(()=>{ const ins=(t.ins||[]).map((p,i)=>inV(n,i)); if(impl&&impl.post)impl.post(n.params,ins,st(n.id)); }); }
  for(const id of topoOrder(graph,back)){
    const n=graph.nodes.find(x=>x.id===id); if(!n||isBreaker(n))continue;
    if(n.k==='const'){ const v=pyLitVal(n.value); V[n.id+':0']=v; wr(n,0,v); continue; }
    if(n.k==='gin'){ const v=args[n.pi]; V[n.id+':0']=v; wr(n,0,v); continue; }
    if(n.k==='gout'){ outs[n.pi]=inV(n,0); continue; }
    if(n.k==='vget'){ const v=JSVARS[n.varName]; V[n.id+':0']=v; wr(n,0,v); continue; }
    if(n.k==='vset'){ JSVARS[n.varName]=inV(n,0); continue; }
    if(n.k!=='blk') continue;
    const t=typeOf(n.type); if(!t) continue;
    const ins=(t.ins||[]).map((p,i)=>inV(n,i));
    let o=[];
    if(t.impl==='graph'){ o=jsRun(t.graph,GEN.blocks[t.id],(path?path+'/':'')+n.id,base+block.child[n.id],ins); }
    else if(t.builtin){ const impl=JSB[t.id]; o=impl?impl(n.params||{},ins,st(n.id)):[]; }
    else if(t.kind==='F'){ const f=pyFn(t); if(f){ const ps=(t.params||[]).map(p=>n.params?n.params[p.name]:p.def);
        try{ const r=f(...ps,...ins,...PYVALS); o=Array.isArray(r)?r:[r]; }catch(e){ o=[0]; } } else o=(t.outs||[]).map(()=>0); }
    else { if(!JSUNSUP.includes(t.name)) JSUNSUP.push(t.name); o=(t.outs||[]).map(()=>0); }
    (t.outs||[]).forEach((p,i)=>{ const v=o[i]===undefined?0:o[i]; V[n.id+':'+i]=v; wr(n,i,v); });
  }
  posts.forEach(f=>f());
  for(const k of zkeys) if(k in V) JSZ[path+'|z|'+k]=V[k];
  return outs;
}

  if(s==='True')return true; if(s==='False')return false; const n=Number(s); return isNaN(n)?0:n; }

function handleLine(s){
  s=s.replace(/\r/g,'');
  if(!s) return;
  if(s[0]==='!'){
    const k=s[1], rest=s.slice(2);
    if(k==='T'){ try{ applyTelemetry(JSON.parse(rest)); }catch(e){} return; }
    if(k==='L'){ log(rest); return; }
    if(k==='E'){ log('error: '+rest,'e'); return; }
    if(k==='K'){ log('· '+rest,'g'); return; }
  }
  if(/^(OK|>|>>>|raw REPL|MPY:|\x04)/.test(s)) { log(s,'i'); return; }
  log(s,'i');
}

/* ---- Web Serial ---------------------------------------------------- */
let port=null, writer=null, readerAbort=null, rxbuf='', connected=false;
async function connectSerial(){
  if(!('serial' in navigator)){ alert('This browser has no Web Serial API.\nUse Chrome/Edge/Opera (desktop) over https:// or file://.\nYou can still use Simulate ▶.'); return; }
  try{
    port=await navigator.serial.requestPort();
    await port.open({baudRate:115200});
    writer=port.writable.getWriter();
    connected=true; setBase('connected','on');
    $('#bDeploy').disabled=false; $('#bPatch').disabled=false; $('#bStop').disabled=false;
    $('#bConnect').textContent='Disconnect';
    log('· serial connected @115200','g');
    readLoop();
    await wr('\r\x03\x03');
  }catch(e){ log('connect failed: '+e.message,'e'); }
}
async function disconnectSerial(){
  try{ connected=false; if(writer){ await wr('\r\x03\x03\x02'); writer.releaseLock(); writer=null; }
    if(readerAbort) await readerAbort();
    if(port) await port.close(); }catch(e){}
  port=null; setBase('idle','');
  $('#bDeploy').disabled=true; $('#bPatch').disabled=true; $('#bStop').disabled=true;
  $('#bConnect').textContent='Connect device'; log('· disconnected','i');
}
async function readLoop(){
  const dec=new TextDecoder();
  while(port&&port.readable&&connected){
    const reader=port.readable.getReader();
    readerAbort=async()=>{ try{ await reader.cancel(); }catch(e){} };
    try{
      while(true){ const {value,done}=await reader.read(); if(done) break;
        rxbuf+=dec.decode(value,{stream:true});
        let i; while((i=rxbuf.indexOf('\n'))>=0){ const line=rxbuf.slice(0,i); rxbuf=rxbuf.slice(i+1); handleLine(line); }
        if(rxbuf.length>20000) rxbuf=''; }
    }catch(e){ if(connected) log('read: '+e.message,'e'); }
    finally{ try{reader.releaseLock();}catch(e){} }
    if(!connected) break;
  }
}
async function wr(s){ if(!writer) return; await writer.write(new TextEncoder().encode(s)); }
async function wrChunks(s,size,delay,prog){
  size=size||128; delay=delay===undefined?22:delay;   // stay under 115200 baud
  for(let i=0;i<s.length;i+=size){ await wr(s.slice(i,i+size)); if(delay) await sleep(delay);
    if(prog&&i%2048===0) setStatus(prog+' '+Math.round(100*i/s.length)+'%','busy'); }
}

  await wr('\r\x03\x03'); await sleep(150);

      el('button',{onclick:()=>{simPin(pin,1);}},'drive HIGH'),
      el('button',{onclick:()=>{simPin(pin,0);}},'drive LOW'),
      el('span',{cls:'mono'},'now '+simPinGet(pin))));
  }
  if(t.id==='pin_out'||t.id==='pwm'){
    const pin=n.params.pin|0;
    b.append(el('div',{cls:'sub'},'Virtual pin '+pin));
    b.append(el('div',{cls:'row'},el('span',{cls:'mono'},'value '+simPinGet(pin))));
  }
}


/* ---- help ------------------------------------------------------------- */
const HELP = `<h3>FlowPy quick start</h3>
<div style="font-size:12px;line-height:1.65;max-height:60vh;overflow:auto">
<b>Build</b><br>
Drag blocks from the left onto the canvas. Everything snaps to the 20&nbsp;px grid — block positions, block sizes and
every port — so wires always run along grid lines. Drag from an <i>output</i> port to an <i>input</i> port to wire them
(drag off an input to detach). Square ports are booleans, round ports are numbers. Double&#8209;click a block to edit
its type. <b>Del</b> removes the selection, wheel zooms, drag the background to pan.
<br><br>
<b>Moving blocks</b><br>
Drag a block and everything it feeds moves with it, keeping the same &#916;x/&#916;y — so spacing and the shape of a
signal chain survive edits. Upstream sources stay put. Hold <b>Alt</b> to move one block on its own.<br>
A drag is clamped so no wire can change type: a block can never be pushed behind a block it takes input from, and a
feedback wire can never be flattened into a same-scan one. When that limit is hit the block just stops. Vertical
movement is never restricted.
<br><br>
<b>Wires and direction</b><br>
Wires are straight orthogonal runs. The vertical shaft sits as far left as it can &mdash; one unit clear of the output
port &mdash; and every corner is a 45&deg; cut half a unit wide by half a unit tall. So an offset connection reads as:
half-unit stub, corner, shaft, corner, half-unit stub. A downstream block always sits at least two units clear of its
source, which is exactly the room those four pieces need. When a block is in the way the router searches the grid for
the shortest path around it, still keeping vertical runs to the left; everything re-routes when you move something.<br>
A wire that travels <b>left&nbsp;→&nbsp;right</b> is evaluated in the <b>same scan</b>.<br>
A wire that travels <b>right&nbsp;→&nbsp;left</b> is drawn dashed and violet with a
<span style="color:#c9a4ff">&#8634;&nbsp;z&#8315;&#185;</span> tag: it carries the <b>previous scan's</b> value.
That is how feedback works — just wire backwards. Because every forward wire strictly increases x, the same-scan graph
can never contain a loop, so layout <i>is</i> execution order. Move a block to the other side of its source and the
timing changes with it.
<br><br>
<b>Make your own blocks</b><br>
<b>+F</b> = stateless function, <b>+FB</b> = function block with state. In the <i>Type</i> tab choose
<i>Python source</i> and write any MicroPython you like (F = one function body, FB = <code>__init__</code> + <code>step</code>),
or choose <i>Flow diagram</i> and wire the implementation up from other blocks. Parameters become constructor arguments
you can set per instance.
<br><br>
<b>DELAY z&#8315;&#185; block</b><br>
Still available when you want an explicit one-scan delay on a wire that runs forwards.
<br><br>
<b>Run it</b><br>
<b>Simulate</b> executes the design in the browser — the <i>Python</i> engine runs the exact generated MicroPython under
Pyodide, the <i>fast</i> engine is an offline interpreter (builtin blocks exact; user Python must be a single
<code>return &lt;expr&gt;</code>). <b>Connect device</b> + <b>Deploy</b> pushes the generated program to a MicroPython
board over USB (Chrome/Edge, Web&nbsp;Serial). <b>Live patch</b> re-sends the code into the running program without
resetting block state — edit a Python body or add blocks and patch while it runs.
<br><br>
<b>Debugging</b><br>
The board streams every signal back each telemetry period. Booleans light up green, numbers get an auto-scaled
colour ramp plus a value label. Open a composite block while running to watch inside it; use the instance selector
in the breadcrumb if it is used more than once. The <i>Vars</i> tab shows live values and can force a value onto the
running device.
<br><br>
<b>Board setup</b><br>
Any board running MicroPython (ESP32, RP2040, STM32…). Nothing needs to be installed on it — FlowPy talks to the
REPL. The generated code is plain MicroPython; the <i>Code</i> tab lets you copy or download it.
</div>`;
function showHelp(){ $('#mbox').innerHTML=HELP+`<div class="mrow"><button class="pri" id="mok">Got it</button></div>`;
  $('#modal').classList.add('on'); $('#mok').onclick=()=>$('#modal').classList.remove('on'); }
$('#bHelp').onclick=showHelp;
$('#modal').onclick=e=>{ if(e.target.id==='modal') $('#modal').classList.remove('on'); };

/* ---- project I/O ---------------------------------------------------- */
function saveProject(){ dl((P_.name||'flowpy')+'.json', JSON.stringify(P_,null,1), 'application/json'); log('· saved','g'); }
function loadProject(obj){
  P_=Object.assign(emptyProject(),obj);
  let mx=0; const scan=g=>g&&g.nodes&&g.nodes.forEach(n=>{const m=+String(n.id).slice(1); if(m>mx)mx=m;});
  scan(P_.main); Object.values(P_.types).forEach(t=>{scan(t.graph); const m=+String(t.id).slice(1); if(m>mx)mx=m;});
  _uid=mx+1; view={stack:[]}; sel={nodes:new Set(),wires:new Set()}; LIVE={}; RANGE={};
  snapProject(P_); tagProject(P_); renderPalette(); renderGraph(); markDirty();
}
$('#bSave').onclick=saveProject;
$('#bLoad').onclick=()=>$('#fileIn').click();
$('#fileIn').onchange=e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader();
  r.onload=()=>{ try{ loadProject(JSON.parse(r.result)); log('· loaded '+f.name,'g'); }catch(err){ log('bad project file: '+err.message,'e'); } };
  r.readAsText(f); e.target.value=''; };
$('#bNew').onclick=()=>{ if(!confirm('Discard current project?')) return; loadProject(emptyProject()); };
$('#bConnect').onclick=()=> connected? disconnectSerial() : connectSerial();
$('#bDeploy').onclick=deploy;
$('#bPatch').onclick=()=> SIM.on? simPatch() : patch();
$('#bStop').onclick=stopDev;
$('#bSim').onclick=startSim;

/* ---- demo project ---------------------------------------------------- */
function demoProject(){
  const p=emptyProject(); p.name='demo';
  p.vars=[{name:'presses',type:'num',init:'0'},{name:'level',type:'num',init:'0'}];
  const N=(g,k,o)=>{ const n=Object.assign({id:uid('n'),k},o); g.nodes.push(n); return n; };
  const blk=(g,type,x,y,params)=>N(g,'blk',{type,x,y,params:Object.assign({},
    ((typeOf(type).params)||[]).reduce((a,q)=>(a[q.name]=q.def,a),{}),params||{})});
  const W_=(g,a,ai,b,bi)=>g.wires.push({id:uid('w'),f:[a.id,ai],t:[b.id,bi]});

  /* user F written in python */
  const pct={id:uid('t'),name:'PERCENT',kind:'F',impl:'py',group:'User',
    ins:[IO('x','num')],outs:[IO('y','num')],params:[],
    step:'# any python you like\nreturn round(x * 100.0, 1)', graph:{nodes:[],wires:[]}};
  p.types[pct.id]=pct;

  /* user FB implemented as a flow diagram: counts rising edges of a bool */
  const ec={id:uid('t'),name:'EDGE COUNT',kind:'FB',impl:'graph',group:'User',
    ins:[IO('x','bool')],outs:[IO('n','num')],params:[],graph:{nodes:[],wires:[]}};
  p.types[ec.id]=ec;
  const P0=P_; P_=p;                          // typeOf() needs the new project
  syncIOFor(ec);
  const gi=ec.graph.nodes.find(n=>n.k==='gin'), go=ec.graph.nodes.find(n=>n.k==='gout');
  gi.x=-30; gi.y=60; go.x=560; go.y=60;
  const e1=blk(ec.graph,'edge',160,40), c1=blk(ec.graph,'counter',370,40);
  W_(ec.graph,gi,0,e1,0); W_(ec.graph,e1,0,c1,0); W_(ec.graph,c1,0,go,0);

  /* main diagram */
  const g=p.main;
  const bl=blk(g,'blink',40,40,{period_ms:600});
  const po=blk(g,'pin_out',430,40,{pin:2});
  W_(g,bl,0,po,0);

  const btn=blk(g,'pin_in',40,150,{pin:0,pull_up:true,invert:true});
  const eco=blk(g,ec.id,250,150);
  const vs =N(g,'vset',{x:470,y:150,varName:'presses'});
  W_(g,btn,0,eco,0); W_(g,eco,0,vs,0);

  const ad=blk(g,'adc',40,260,{pin:34});
  const fl=blk(g,'ema',210,260,{alpha:0.15});
  const pc=blk(g,pct.id,400,260);
  const vl=N(g,'vset',{x:560,y:260,varName:'level'});
  W_(g,ad,0,fl,0); W_(g,fl,0,pc,0); W_(g,pc,0,vl,0);

  const sc=blk(g,'hyst',400,360,{lo:0.35,hi:0.65});
  const pr=blk(g,'print',640,360,{label:'threshold',on_change:true});
  W_(g,fl,0,sc,0); W_(g,sc,0,pr,0);

  /* feedback demo: the compare wires BACK into the counter's reset (right-to-left = next scan) */
  const bk=blk(g,'blink',40,560,{period_ms:200});
  const ct=blk(g,'counter',240,560);
  const k4=N(g,'const',{x:240,y:680,value:4,vtype:'num'});
  const cmp=blk(g,'gt',460,560);
  const pr2=blk(g,'print',680,560,{label:'ramp',on_change:true});
  W_(g,bk,0,ct,0); W_(g,ct,0,cmp,0); W_(g,k4,0,cmp,1); W_(g,ct,0,pr2,0);
  W_(g,cmp,0,ct,1);                       // <- back wire

  snapProject(p); tagProject(p);
  P_=P0;
  return p;
}

/* ---- boot -------------------------------------------------------------- */
function boot(){
  P_=demoProject();
  applyCam(); renderPalette(); showTab('insp'); renderGraph(); markDirty();
  log('FlowPy ready.','g');
  log('· Simulate ▶ runs the exact generated MicroPython in your browser (Pyodide, virtual pins).','i');
  log('· Connect device → Deploy ▶ pushes it to a MicroPython board over USB (Chrome/Edge).','i');
  log('· Live patch ⚡ re-sends code without resetting block state.','i');
  if(!('serial' in navigator)) log('· Web Serial not available in this browser — simulation only.','w');
}
boot();
